<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Rutina en casa</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#131f24">
  <meta name="description" content="Rutina de ejercicios en casa con rachas, estilo Duolingo.">

  <!-- iOS: instalable como app a pantalla completa -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Rutina">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app" aria-live="polite"></main>

  <!-- Temporizador de descanso (aparece al marcar una serie) -->
  <div id="rest" class="rest" hidden>
    <span class="rest-label">Descanso</span>
    <span id="rest-time" class="rest-time">1:15</span>
    <button class="btn-mini" data-act="rest-minus">−15</button>
    <button class="btn-mini" data-act="rest-plus">+15</button>
    <button class="btn-mini" data-act="rest-skip">Saltar</button>
  </div>

  <nav id="tabbar" class="tabbar">
    <button data-tab="home"><span>🔥</span>Hoy</button>
    <button data-tab="progress"><span>📈</span>Progreso</button>
    <button data-tab="settings"><span>⚙️</span>Ajustes</button>
  </nav>

  <canvas id="confetti" aria-hidden="true"></canvas>
  <div id="toast" class="toast" hidden></div>
  <div id="modal" class="modal" hidden></div>

  <script src="app.js"></script>
</body>
</html>
